name: Run FIT Testing

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: false
        type: string
        default: op-multi-lite

      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true

      channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci

  workflow_call:
    inputs:
      preset:
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  fit:
    # Not pinned: the nightly FIT runs follow fit-cli's latest stable release,
    # its "ci" release tag. "ci" is also the default install channel below, so
    # the workflow and the binary come from the same release.
    # bin/check-action-pins.rb allows exactly this reference. fit-cli also has a
    # "ci" branch, and whoever can push it can move the tag as well.
    uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@ci # zizmor: ignore[unpinned-uses,ref-confusion]
    with:
      preset: ${{ inputs.preset || vars.FIT_CLI_PRESET || 'op-multi-lite' }}
      collect_extra_diagnostics: ${{ inputs.collect_extra_diagnostics != false }}
      performer: 'ruby-fit-performer:main'
      channel: ${{ inputs.channel || vars.FIT_CLI_CHANNEL || 'ci' }}
