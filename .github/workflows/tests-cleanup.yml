name: tests-cleanup
permissions: {}

# Deletes the intermediate artifacts of a completed tests run with
# bin/ci-cleanup.rb. For workflow_run, GitHub takes this file and the checkout
# from the default branch, so a pull request, including one from a fork, cannot
# change what runs with the write token. It downloads no artifact and runs
# nothing from the triggering run, which is what makes workflow_run dangerous
# elsewhere. workflow_dispatch runs from the chosen branch and is for people
# who can push to the repository anyway.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the tests run to clean up
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write # delete artifacts
      contents: read # check out the script
    steps:
      # Pinned: this job holds a write token. v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: bin/ci-cleanup.rb
          sparse-checkout-cone-mode: false
      - name: Delete intermediate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        # The runner image's Ruby; the script needs only the standard library and gh.
        run: ruby bin/ci-cleanup.rb "${RUN_ID}"
