  mock_linux_x86_64:
    # Above the sum of the step timeouts, so that a step times out before the job does.
    timeout-minutes: 35
    needs:
      - source
      - repackage_linux_x86_64
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: couchbase-opentelemetry-${{ needs.source.outputs.otel_gem_version }}
      - name: Use the installed gem instead of lib/
        run: rm -rf lib
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install
        timeout-minutes: 10
        env:
          GEM_VERSION: ${{ needs.source.outputs.gem_version }}
          OTEL_GEM_VERSION: ${{ needs.source.outputs.otel_gem_version }}
        run: |
          COUCHBASE_GEM_PATH=$(realpath "couchbase-${GEM_VERSION}"-*.gem)
          COUCHBASE_OPENTELEMETRY_GEM_PATH=$(realpath "couchbase-opentelemetry-${OTEL_GEM_VERSION}.gem")
          mkdir -p local-gem-repo/gems
          mv ${COUCHBASE_GEM_PATH} local-gem-repo/gems
          mv ${COUCHBASE_OPENTELEMETRY_GEM_PATH} local-gem-repo/gems
          GEM_REPO_PATH=$(realpath local-gem-repo)
          gem generate_index --directory local-gem-repo
          ruby -i.bak -pe "gsub(/gemspec$/, 'gem \"couchbase\", source: \"file://${GEM_REPO_PATH}\"')" Gemfile
          ruby -i.bak -pe "gsub(/gemspec path: \"couchbase-opentelemetry\"$/, 'gem \"couchbase-opentelemetry\", source: \"file://${GEM_REPO_PATH}\"')" Gemfile
          bundle install
          bundle exec ruby -r bundler/setup -r couchbase -r couchbase/opentelemetry -e 'pp Couchbase::VERSION, Couchbase::BUILD_INFO, {otel: Couchbase::OpenTelemetry::VERSION}'
      - name: Test
        # Below the job timeout, so that the failure() steps still upload the logs.
        timeout-minutes: 8
        env:
