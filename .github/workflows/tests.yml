  build_windows:
    needs: source
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        exclude:
          # RubyInstaller ships arm64 builds starting with Ruby 3.4
          - arch: arm64
            ruby: '3.2'
          - arch: arm64
            ruby: '3.3'
    steps:
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          $PREFIX = $env:MINGW_PACKAGE_PREFIX
          $PACKAGES = @("patch", "$PREFIX-cmake", "$PREFIX-go", "$PREFIX-ninja", "$PREFIX-toolchain")
          if ("${{ matrix.arch }}" -eq "x64") { $PACKAGES += "$PREFIX-nasm" }
          # A slow mirror can fail the download; retry once
          ridk exec pacman --sync --noconfirm --needed @PACKAGES
          if ($LASTEXITCODE -ne 0) { ridk exec pacman --sync --noconfirm --needed @PACKAGES }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}
      - name: Install gem-compiler
        timeout-minutes: 10
        run: gem install gem-compiler
      - name: Precompile
        env:
          GEM_VERSION: ${{ needs.source.outputs.gem_version }}
          CB_STATIC_BORINGSSL: 1
          CB_STATIC_STDLIB: 1
          CB_REMOVE_EXT_DIRECTORY: 1
        run: |
          gem compile --prune "couchbase-$($env:GEM_VERSION).gem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: couchbase-${{ needs.source.outputs.gem_version }}-${{ matrix.arch }}-mingw-${{ matrix.ruby }}
          path: |
            *-mingw*.gem

  repackage_windows:
    needs:
      - source
      - build_windows
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bin/jenkins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg/binary
          pattern: couchbase-${{ needs.source.outputs.gem_version }}-${{ matrix.arch }}-mingw-*
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: 4.0
      - name: Repackage
        run: |
          ruby bin/jenkins/repackage-extension.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}-${{ matrix.arch }}-mingw
          path: |
            pkg/fat/*.gem

