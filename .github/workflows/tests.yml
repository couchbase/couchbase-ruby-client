name: tests
permissions: {}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release*
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - main
      - release*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      gem_version: ${{ steps.build_gem.outputs.gem_version }}
      otel_gem_version: ${{ steps.build_otel_gem.outputs.otel_gem_version }}
      build_number: ${{ steps.build_gem.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: 3.3
          bundler-cache: true
      - name: Build couchbase gem
        id: build_gem
        run: |
          COMMITS_SINCE_LAST_TAG=$(git describe --tags --always --long | awk -F '-' '{print $2}')
          ruby bin/jenkins/patch-version.rb ${COMMITS_SINCE_LAST_TAG}
          echo "build_number=${COMMITS_SINCE_LAST_TAG}" >> "$GITHUB_OUTPUT"
          GEM_VERSION=$(ruby -r ./lib/couchbase/version.rb -e "puts Couchbase::VERSION[:sdk]")
          echo "gem_version=${GEM_VERSION}" >> "$GITHUB_OUTPUT"
          bundle exec rake build
      - name: Build couchbase-opentelemetry gem
        id: build_otel_gem
        run: |
          cd couchbase-opentelemetry
          OTEL_GEM_VERSION=$(ruby -r ./lib/couchbase/opentelemetry/version.rb -e "puts Couchbase::OpenTelemetry::VERSION")
          echo "otel_gem_version=${OTEL_GEM_VERSION}" >> "$GITHUB_OUTPUT"
          bundle exec rake build
      - name: Generate documentation for the couchbase gem
        run: |
          cat > patch-readme.rb <<EOF
          require_relative "./lib/couchbase/version.rb"
          gemfile = <<EOS.strip
            gem "couchbase", "#{Couchbase::VERSION[:sdk]}"
          EOS
          old_content = File.read("README.md")
          new_content = old_content.gsub(/(gem "couchbase", ").*?"/, gemfile)
          File.write("README.md", new_content)
          EOF
          ruby patch-readme.rb
          bundle exec rake doc
      - name: Generate documentation for the couchbase-opentelemetry gem
        run: |
          cd couchbase-opentelemetry
          cat > patch-readme.rb <<EOF
          require_relative "./lib/couchbase/opentelemetry/version.rb"
          gemfile = <<EOS.strip
            gem "couchbase-opentelemetry", "#{Couchbase::OpenTelemetry::VERSION}"
          EOS
          old_content = File.read("README.md")
          new_content = old_content.gsub(/(gem "couchbase-opentelemetry", ").*?"/, gemfile)
          File.write("README.md", new_content)
          EOF
          ruby patch-readme.rb
          bundle exec rake doc
      - name: Upload artifact - couchbase gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-${{ steps.build_gem.outputs.gem_version }}
          path: |
            pkg/*.gem
      - name: Upload artifact - couchbase-opentelemetry gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-opentelemetry-${{ steps.build_otel_gem.outputs.otel_gem_version }}
          path: |
            couchbase-opentelemetry/pkg/*.gem
      - name: Upload artifact - couchbase gem docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ steps.build_gem.outputs.gem_version }}
          path: |
            doc/**/*
      - name: Upload artifact - couchbase-opentelemetry gem docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otel-docs-${{ steps.build_otel_gem.outputs.otel_gem_version }}
          path: |
            couchbase-opentelemetry/doc/**/*
      
  build_alpine_x86_64:
    # FIXME(SA): add aarch64 for Alpine Linux
    # Right now github does not allow to execute JS-based actions (like
    # download-artifact) inside alpine container, throwing the following
    # message:
    #
    #   JavaScript Actions in Alpine containers are only supported on x64 Linux
    #   runners. Detected Linux Arm64
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    container:
      image: alpine:3.18@sha256:de0eb0b3f2a47ba1eb89389859a9bd88b28e82f5826b6969ad604979713c2d4f
    steps:
      - name: Install build environment
        timeout-minutes: 15
        run: |
          apk update
          apk add --no-cache \
            bash \
            build-base \
            ccache \
            cmake \
            curl \
            g++ \
            gcc \
            git \
            linux-headers \
            make \
            openssl \
            openssl-dev \
            readline-dev \
            ruby \
            tar \
            xz \
            yaml-dev \
            zlib-dev
      # Before ccache-action: checkout empties the workspace, where the cache lives.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          max-size: 2G
          key: ${{ github.job }}
      - name: Install build environment
        # Downloads and compiles four Rubies.
        timeout-minutes: 40
        env:
          SUPPORTED_RUBY_VERSIONS: "3.2 3.3 3.4 4.0"
        run: |
          bash bin/jenkins/install-rubies.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg
          name: couchbase-${{ needs.source.outputs.gem_version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg
          name: couchbase-opentelemetry-${{ needs.source.outputs.otel_gem_version }}
      - name: Build gem
        timeout-minutes: 90
        env:
          SUPPORTED_RUBY_VERSIONS: "3.2 3.3 3.4 4.0"
          BUNDLE_ALLOW_ROOT: true
          BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
        run: |
          ruby bin/jenkins/patch-version.rb "${BUILD_NUMBER}"
          bash bin/jenkins/build-gem.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-musl
          path: |
            pkg/fat/*.gem

  build_linux_x86_64:
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: hendrikmuhs/ccache-action@5ebbd400eff9e74630f759d94ddd7b6c26299639 # v1.2.20
        with:
          max-size: 2G
          key: ${{ github.job }}-${{ matrix.ruby }}
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}
      - name: Install gem-compiler
        timeout-minutes: 10
        run: gem install gem-compiler
      - name: Precompile
        env:
          GEM_VERSION: ${{ needs.source.outputs.gem_version }}
          CB_STATIC_BORINGSSL: 1
          CB_STATIC_STDLIB: 1
          CB_REMOVE_EXT_DIRECTORY: 1
        run: |
          gem compile --strip --prune "couchbase-${GEM_VERSION}.gem"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 1
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-${{ matrix.ruby }}
          path: |
            *-x86_64-linux.gem

  repackage_linux_x86_64:
    needs:
      - source
      - build_linux_x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: bin/jenkins
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg/binary/3.2
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-3.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg/binary/3.3
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg/binary/3.4
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-3.4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: pkg/binary/4.0
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux-4.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        timeout-minutes: 10
        with:
          ruby-version: 4.0
      - name: Repackage
        run: |
          ruby bin/jenkins/repackage-extension.rb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couchbase-${{ needs.source.outputs.gem_version }}-x86_64-linux
          path: |
