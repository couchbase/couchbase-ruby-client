          mv "couchbase-${GEM_VERSION}"-*.gem local-gem-repo/gems
          mv "couchbase-opentelemetry-${OTEL_GEM_VERSION}.gem" local-gem-repo/gems
          # realpath in Git Bash prints /d/a/..., which is not a Windows path; File.expand_path gives D:/a/...
          GEM_REPO_URL=$(ruby -e 'puts "file:///#{File.expand_path("local-gem-repo")}"')
          gem generate_index --directory local-gem-repo
          ruby -i.bak -pe "gsub(/gemspec$/, 'gem \"couchbase\", source: \"${GEM_REPO_URL}\"')" Gemfile
          ruby -i.bak -pe "gsub(/gemspec path: \"couchbase-opentelemetry\"$/, 'gem \"couchbase-opentelemetry\", source: \"${GEM_REPO_URL}\"')" Gemfile
