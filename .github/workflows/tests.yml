        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.job }}-${{ github.run_attempt }}-${{ matrix.arch }}-${{ matrix.ruby }}-logs
          path: |
            caves-logs/*
            logs/*
            test/**/*.log
            test/reports/
          retention-days: 5
      - name: Upload test report
        if: always()
        # The summary marks a configuration without a report.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ github.job }} (${{ matrix.arch }}, ${{ matrix.ruby }})
          path: test/reports/*.xml
          if-no-files-found: ignore
          overwrite: true
          retention-days: 3

  summary:
    # Runs after failed jobs and after cancellation, by a person or by a newer run
    # in the concurrency group; each step is always() too, so a cancellation that
    # arrives while it runs does not stop it. Fails if the report is incomplete.
    if: always()
    needs:
      - source
      - build_alpine_x86_64
      - repackage_linux_aarch64
      - mock_linux_x86_64
      - mock_macos_arm64
      - mock_macos_x86_64
      - mock_windows
      - test_linux_x86_64
      - test_cng_linux_x86_64
    runs-on: ubuntu-24.04
    # Above the sum of the step timeouts, so that a step times out before the job does.
    timeout-minutes: 25
    # Read-only: on a pull request this runs the pull request's own script.
    # Artifact deletion happens in tests-cleanup.yml.
    permissions:
      actions: read # jobs and artifacts
      checks: read # job annotations, to tell timeouts and lost runners apart
      contents: read
    steps:
      # Each step may fail: the script reports the inputs it could not get, and
      # the fallback step below reports when the script did not run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        with:
          persist-credentials: false
          sparse-checkout: |
            bin/ci-summary.rb
            bin/ci-cleanup.rb
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        with:
          path: reports
          pattern: junit-*
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        # Without it the runner image's Ruby is used.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          ruby-version: 3.4
      - name: Summarize
        id: summarize
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_TITLE: ${{ github.workflow }}
          SUMMARY_SUBTITLE: >-
            couchbase ${{ needs.source.outputs.gem_version || '(not built)' }},
            couchbase-opentelemetry ${{ needs.source.outputs.otel_gem_version || '(not built)' }},
            ${{ github.sha }}
        run: ruby bin/ci-summary.rb reports
      - name: Summarize job results without details
        if: always() && steps.summarize.outputs.written != 'true'
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## ⚠️ ${GITHUB_WORKFLOW}: detailed report unavailable"
            echo
            echo "bin/ci-summary.rb did not write a report; its output is in the log of this job."
            echo "Only the jobs this job needs directly are listed; a matrix entry shows the worst result."
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "${NEEDS}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Fail if the report is incomplete
        if: always() && steps.summarize.outcome != 'success'
        run: |
          echo "::error title=Incomplete summary::bin/ci-summary.rb failed or reported problems; see the Summarize step."
          exit 1
